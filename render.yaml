services:
  - type: web
    name: resume-ats-backend
    env: python
    plan: free
    pythonVersion: 3.10
    buildCommand: pip install -r backend/requirements-render.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: PYTHONUNBUFFERED
        value: 1
